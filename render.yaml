services:
  - type: web
    name: crm-backend
    runtime: python
    plan: free
    buildCommand: |
      pip install -r admin/crm/crm/backend/requirements.txt
      cd admin/crm/crm/frontend && npm install && npm run build && cp -r dist/* ../backend/frontend_build/
    startCommand: |
      cd admin/crm/crm/backend && python manage.py migrate && python manage.py collectstatic --noinput && gunicorn education_crm.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: education_crm.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: crm-postgres
          property: connectionString

databases:
  - name: crm-postgres
    plan: free
