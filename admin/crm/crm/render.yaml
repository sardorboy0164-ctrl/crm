services:
  - type: web
    name: education-crm
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: cd backend && gunicorn education_crm.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: education-crm-db
          property: connectionString
    healthCheckPath: /admin/
    autoDeploy: true

databases:
  - name: education-crm-db
    plan: free
    databaseName: education_crm
